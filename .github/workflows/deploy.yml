name: Deploy HomeLab

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy all services
        run: |
          cd /home/nusheen/traefik && docker compose pull && docker compose up -d
          cd /home/nusheen/portainer && docker compose pull && docker compose up -d
          cd /home/nusheen/monitoring && docker compose pull && docker compose up -d
          cd /home/nusheen/uptime-kuma && docker compose pull && docker compose up -d
          cd /home/nusheen/minecraft && docker compose pull && docker compose up -d
          cd /home/nusheen/pihole && docker compose pull && docker compose up -d
