route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'discord'

receivers:
  - name: 'discord'
    discord_configs:
      - webhook_url: 'https://discord.com/api/webhooks/1562107806272987237/ngv5jjRMOngeL6aoNHk1P1-osoZiaOai8cJdt8pQopcuGkQr98v3Adw_1vtBUSA5cUmN'
        title: '{{ .CommonLabels.alertname }}'
        message: |
          {{ range .Alerts }}
          **Status:** {{ .Status }}
          **Summary:** {{ .Annotations.summary }}
          **Description:** {{ .Annotations.description }}
          {{ end }}
